.login .box{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6)}
.login .box{background:#fff;border-radius:24px;padding:38px 32px;width:380px;box-shadow:0 30px 70px rgba(30,40,25,.28)}
.login .logo{width:96px;height:96px;margin:0 auto 14px;display:block}
.login h1{text-align:center;font-size:20px;margin:0 0 2px}.login p{text-align:center;color:var(--muted);margin:0 0 20px;font-size:13px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:12px;font-family:inherit}
.login button{width:100%;padding:12px;background:var(--pri);color:#fff;border:0;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer}
.login .err{color:#e2574f;font-size:13px;text-align:center;min-height:18px;margin-top:8px}
/* APP */
.layout{display:flex;min-height:100vh}
.side{width:238px;background:var(--side);color:#d7ddcf;flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;position:relative}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;color:#fff}
.brand .logo{width:40px;height:40px;flex-shrink:0}
.brand .bt{display:flex;flex-direction:column;line-height:1.1}
.brand .bt b{font-family:Georgia,serif;font-size:18px;font-weight:400;letter-spacing:.3px}
.brand .bt i{font-style:normal;font-size:9.5px;letter-spacing:2.6px;color:#a9b79a}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#d7ddcf;text-decoration:none;font-size:14.5px;cursor:pointer;transition:background .16s,color .16s,transform .16s}
.nav a .ic{width:20px;text-align:center}.nav a:hover{background:var(--side2);transform:translateX(2px)}
.nav a.on{background:linear-gradient(135deg,var(--sage),#6f8060);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.nav .sep{font-size:11px;color:#5e7a71;padding:12px 12px 4px;text-transform:uppercase;letter-spacing:.5px}
.nav .foot{margin-top:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:20}
.top h2{font-size:17px;margin:0;flex:1;font-weight:700}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:0}
.chip.in{background:#e2efdc;color:#4d7343}.chip.out{background:#eef1e9;color:var(--pri-d)}
.bell{position:relative;font-size:20px;cursor:pointer;padding:6px 8px;border-radius:10px;line-height:1;transition:background .15s}
.bell:hover{background:#eef1e9}
.bdot{position:absolute;top:0;right:0;background:#cf6a5e;color:#fff;border-radius:999px;font-size:10px;font-weight:800;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s}

.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.box h3{font-size:14px;margin:0 0 12px}
.box h3 small{color:var(--muted);font-weight:400}
/* ===== Trello-like Kanban Board ===== */
.kan{display:grid;grid-template-columns:repeat(7,minmax(250px,1fr));gap:12px;padding:4px 2px 24px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.col{background:#f1efe8;border:0;border-radius:14px;padding:8px 8px 4px;min-height:120px;display:flex;flex-direction:column;max-height:calc(100vh - 200px);scroll-snap-align:start;box-shadow:0 1px 2px rgba(43,51,39,.06)}
.col h4{font-size:13px;margin:6px 8px 10px;text-align:left;color:#fff;padding:6px 10px;border-radius:8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}

.col-body{flex:1;overflow-y:auto;padding:2px}
.col-body::-webkit-scrollbar{width:6px}.col-body::-webkit-scrollbar-thumb{background:rgba(43,51,39,.15);border-radius:3px}
/* ===== Trello-like Card ===== */
.kc{background:#fff;border:0;border-radius:10px;padding:0;margin:0 0 8px;font-size:13.5px;cursor:pointer;box-shadow:0 1px 0 rgba(9,30,66,.15);transition:transform .08s,box-shadow .08s;overflow:hidden;position:relative}
.kc:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(9,30,66,.22)}
.kc:active{cursor:grabbing;transform:rotate(2deg)}
.kc.revise{background:#fde5e0!important;box-shadow:0 2px 8px rgba(207,106,94,.25)}
/* ⏳ การ์ด Done ที่รอ Approve — ขอบม่วงบางๆ สื่อว่ายังไม่จบ */
.kc.pending{box-shadow:0 1px 0 rgba(9,30,66,.15),inset 3px 0 0 #8a5cd0}
.kc.pending:hover{box-shadow:0 4px 10px rgba(138,92,208,.28),inset 3px 0 0 #8a5cd0}
.kc.revise::before{content:'✏️ ต้องแก้ไข';color:#cf6a5e;font-weight:800;font-size:11px;display:block;padding:6px 12px 0;letter-spacing:.3px}
.kc .kcCover{width:100%;height:120px;object-fit:cover;display:block;background:#f4f7ef}
.kc .kcBody{padding:8px 12px 10px}
.kc .kcLabels{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.kc .kcLabel{height:8px;min-width:36px;border-radius:4px;transition:height .1s,min-width .1s}

.kc .kcTitle{line-height:1.36;color:var(--ink);word-break:break-word}
.kc .kcFoot{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.kc .kcFoot .fi{display:inline-flex;align-items:center;gap:3px}
.kc .kcAv{width:24px;height:24px;border-radius:50%;background:var(--sage);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;margin-left:-6px}
.kc .m{font-size:11px;color:var(--muted);margin-top:4px}
.col.drag{outline:2px dashed var(--pri);outline-offset:-4px;background:#e8eddf}
/* Trello-style quick-add */
.addcard{margin:2px 4px 4px}
.addbtn{display:block;padding:9px 10px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;text-align:left;transition:background .12s}
.addbtn:hover{background:rgba(9,30,66,.08);color:var(--pri-d)}
.qa{background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 0 rgba(9,30,66,.15)}
.qaInput{width:100%;border:0;outline:0;resize:none;font-family:inherit;font-size:14px;padding:6px;min-height:56px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line)}th{background:#f0f3ea;color:#5a614f;font-size:12px}
tr:hover td{background:#fafbf7}
.btn{background:linear-gradient(135deg,var(--sage),#6f8060);color:#fff;border:0;padding:10px 17px;border-radius:11px;font-weight:700;cursor:pointer;font-size:13.5px;transition:transform .14s,box-shadow .14s,filter .14s;box-shadow:0 4px 12px rgba(122,139,105,.28)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}.btn:active{transform:translateY(0)}
.btn.g{background:linear-gradient(135deg,#6f9e63,#5b8551)}.btn.r{background:linear-gradient(135deg,#cf6a5e,#b4544a)}
.btn.ghost{background:#eef1e9;color:var(--pri-d);box-shadow:none;border:1px solid var(--line)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin:4px 0 10px;font-family:inherit}
label{font-size:12.5px;color:#556;font-weight:600}
.li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}.li small{color:var(--muted)}
.li:last-child{border-bottom:0}
.badge{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.done{background:#e2efdc;color:#4d7343}.pill.doing{background:#fbf0d6;color:#9b6f1c}
.pill.blocked{background:#f9e0dd;color:#a94a3f}.pill.review{background:#f5e3ed;color:#9c5480}
.pill.need{background:#e3ebf4;color:#446189}.pill.todo{background:#eef0e9;color:#6d7364}
.pin{background:#fff8e1;border:1px solid #f3e2a8;border-radius:10px;padding:12px;margin-bottom:10px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:74px;padding:5px;font-size:11px}
.cell.today{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.cell .d{font-weight:700;color:#9aa08e}.cell .t{background:#eef2e7;color:var(--pri-d);border-radius:5px;padding:1px 4px;margin-top:3px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.hasev{cursor:pointer}.cell.hasev:hover{border-color:var(--sage);background:#f4f7ef;box-shadow:0 0 0 1px var(--sage);transform:translateY(-1px)}
.cbadge{display:inline-block;background:#e8eddf;color:var(--pri-d);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;margin-top:3px}
.cdots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}.cdot{width:8px;height:8px;border-radius:50%}
.daygrp{margin-bottom:12px}.daygrp .nm{font-weight:700;color:var(--pri-d);margin-bottom:2px}
/* ช่วงเวลา (เริ่ม–สิ้นสุด) */
.trow{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.trow input{margin:0;flex:1}.tsep{color:var(--muted);font-size:13px;flex-shrink:0}
/* เลือกผู้รับงานหลายคน (ชิปแตะเลือก) */
.duechip{display:inline-block;background:#fdf0d5;color:#8a6d1a;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}
.thumbs{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.thumbA{display:inline-block;position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden;background:#f4f7ef;border:1px solid var(--line);transition:transform .12s}
.thumbA:hover{transform:scale(1.05);border-color:var(--sage)}
.thumb{width:60px;height:60px;object-fit:cover;display:block;cursor:zoom-in}
.thumbA .fbico{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:22px;color:var(--pri-d);cursor:pointer}
.thumbA.fb .fbico{display:flex}     /* โชว์ icon 📎 เมื่อ thumbnail โหลดไม่ได้ */

#plWrap .cell{min-height:110px;padding:6px}#plWrap .plcard:hover{background:#e8eddf!important}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}

.modal{position:fixed;inset:0;background:rgba(15,30,26,.55);display:flex;align-items:center;justify-content:center;z-index:50}

.bigav{width:96px;height:96px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;margin:0 auto 8px;overflow:hidden}

.hello{font-size:22px;font-weight:800;margin:0 0 2px}.subtle{color:var(--muted);font-size:13px}
.stream .row{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.stream .row:last-child{border-bottom:0}
.stream .who{width:66px;flex-shrink:0;font-weight:700;font-size:12.5px;color:var(--ink)}
.stream .it{flex:1;font-size:13px;line-height:1.35}.stream .it small{color:var(--muted)}
/* ===== 🍞 Toast notification (แทน alert) ===== */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#2b3327;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;max-width:90vw}
.toast.ok{background:#4d7343}.toast.err{background:#b4544a}.toast.info{background:#3a5a80}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
/* ===== 💀 Skeleton loading ===== */
.skel{background:linear-gradient(90deg,#eceee6 25%,#f6f7f2 50%,#eceee6 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:10px}

.skelBoard{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:4px 2px}
/* ===== 🈳 Empty column state ===== */
.colEmpty{border:2px dashed #d9ddd0;border-radius:10px;padding:18px 10px;text-align:center;color:#a9b0a3;font-size:12px;margin:2px}
/* ===== ⏰ Due chip สี — เลยกำหนด/วันนี้/ปกติ (Trello-style) ===== */
.duechip.over{background:#f9d9d5;color:#a3392e;font-weight:800}
.duechip.today{background:#fbe9c4;color:#8a6209;font-weight:800}
/* ===== 🔍 Board toolbar ===== */
.ktools{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.ktools .ksearch{flex:1;min-width:200px;position:relative}

/* ===== 💬 Team Chat — ปุ่มลอยมุมล่างขวา ===== */

<!-- ⚡ Chart.js / html2pdf โหลดตอนต้องใช้เท่านั้น (ไม่บล็อกโหลดหน้าแรก) -->
<script>
function loadJS(url){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function needChart(cb){ if(window.Chart) return cb(); loadJS('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js').then(cb); }

<script>
var TOKEN=localStorage.getItem('mersi_token')||'', ME=null, DASH=null, TEAM=null, CUR='home', ATTN=null;
var COLS=[['📋 TODO','todo','#a3a99a'],['🔄 DOING','doing','#d9a441'],['👀 REVIEW','review','#c98aa8'],['✅ DONE','done','#6f9e63'],['⛔ BLOCKED','blocked','#cf6a5e']];
var MAPU={todo:'📋 TODO',doing:'🔄 DOING',review:'👀 REVIEW',done:'✅ DONE',blocked:'⛔ BLOCKED'};
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
// URL ของ Apps Script Web App (ใช้เมื่อเปิดไฟล์แบบ standalone / โฮสต์เอง)
var API_URL='https://script.google.com/macros/s/AKfycbyYS25wLEn_8M2HKdQl-PxoPoAwAb4u8AUKLkXZNiArEG2UVozQZikUc__M9gDNmQeEFw/exec';
function run(fn){
  var a=[].slice.call(arguments,1);
  if(typeof google!=='undefined' && google.script && google.script.run){
    return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,a);});
  }
  return fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:a})}).then(function(r){return r.json()});
}
function el(id){return document.getElementById(id)}
/* 🍞 Toast — feedback ทุก action (แทน alert ที่ block UI) */
function toast(msg,type){
  var c=el('toasts'); if(!c){ c=document.createElement('div'); c.id='toasts'; document.body.appendChild(c); }
  var t=document.createElement('div'); t.className='toast '+(type||'');
  t.innerHTML=(type==='ok'?'✅ ':type==='err'?'⚠️ ':'')+esc(msg);
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); },320); }, type==='err'?4200:2600);
}
/* 🛡️ กันข้อมูลหาย — ถ้าพิมพ์ค้างไว้แล้วจะปิด ให้ยืนยันก่อน */
var MODAL_SNAP=null;
function modalSnapshot(){ var b=el('taskBody'); if(!b) return null;
  return [].slice.call(b.querySelectorAll('input,textarea,select')).map(function(x){return x.value;}).join(''); }
function modalDirty(){ if(MODAL_SNAP===null) return false; var now=modalSnapshot();
  return now!==null && now!==MODAL_SNAP; }
function tryCloseTask(){ if(modalDirty() && !confirm('มีข้อมูลที่ยังไม่ได้บันทึก — ปิดเลยไหม?')) return false;
  MODAL_SNAP=null; closeTask(); return true; }
/* ⌨️ ESC ปิด modal + คลิกพื้นหลังปิด */
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){
  var t=el('taskModal'); if(t&&!t.classList.contains('hide')){ tryCloseTask(); return; }
  var p=el('profileModal'); if(p&&!p.classList.contains('hide')) p.classList.add('hide'); } });
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('modal')){
    if(e.target.id==='taskModal') tryCloseTask(); else e.target.classList.add('hide'); } });
function toggleSide(){var s=document.querySelector('.side');if(s)s.classList.toggle('open');var o=document.querySelector('.overlay');if(o)o.classList.toggle('show');}
function closeSide(){var s=document.querySelector('.side');if(s)s.classList.remove('open');var o=document.querySelector('.overlay');if(o)o.classList.remove('show');}
function avatarHTML(u,cls){return (u&&u.avatar&&u.avatar.indexOf('data:')===0)?'<img src="'+u.avatar+'">':esc((u&&u.name||'?').slice(0,1))}
/* ---- status pill ---- */
function stMeta(st){st=''+st;
  if(st.indexOf('DONE')>-1)return['done','✅ Done'];
  if(st.indexOf('PROGRESS')>-1||st.indexOf('DOING')>-1)return['doing','🔄 Doing'];
  if(st.indexOf('BLOCK')>-1)return['blocked','🚧 Blocker'];
  if(st.indexOf('REVIEW')>-1)return['review','👀 Review'];
  if(st.indexOf('NEED')>-1)return['need','📌 Need'];
  return['todo',st.replace(/^[^\wก-๙]+/,'')||'TODO'];}
function pill(st){var m=stMeta(st);return '<span class="pill '+m[0]+'">'+esc(m[1])+'</span>';}

/* ---------- AUTH ---------- */
window.onload=function(){ if(TOKEN){ run('ws_me',TOKEN).then(function(r){ if(r.ok){ME=r.user;startApp()} else {showLogin()} }).catch(showLogin);} else showLogin(); };
function showLogin(){el('app').classList.add('hide');el('login').classList.remove('hide');chatShow(false);}
function doLogin(){el('lerr').textContent='';var u=el('lu').value,p=el('lp').value;
  run('ws_login',u,p).then(function(r){ if(r.ok){TOKEN=r.token;localStorage.setItem('mersi_token',TOKEN);ME=r.user;el('login').classList.add('hide');startApp();} else {el('lerr').textContent=r.err||'ล็อกอินไม่สำเร็จ';} }).catch(function(e){el('lerr').textContent=e.message});}
function doLogout(){run('ws_logout',TOKEN);localStorage.removeItem('mersi_token');TOKEN='';ME=null;location.reload();}

function startApp(){ el('app').classList.remove('hide'); el('topAv').innerHTML=avatarHTML(ME); buildNav(); loadDash(); initNotify(); chatShow(true); }

/* 🔔 System notification — ขอสิทธิ์ครั้งเดียว + poll ทุก 60 วิ + notify แม้ tab ถูก minimize */
function initNotify(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default'){
    setTimeout(function(){ Notification.requestPermission(); },3000);      // รอ 3 วิให้ user เห็นหน้าก่อนถาม
  }
  // ⚡ REAL-TIME: อยู่หน้า Kanban → ซิงก์ทุก 15 วิ · หน้าอื่น 45 วิ · สลับแท็บออก = หยุด (ไม่กินเน็ต/โควต้า)
  // ⚡ SPEED: timer เดียว 60 วิ (เดิม 15+45 วิ ซ้อนกัน = ยิงเซิร์ฟเวอร์ถี่จนคิวตัน)
  setInterval(function(){
    if(document.hidden) return;                         // ไม่ได้ดูอยู่ → ข้าม
    if(CUR==='tasks') syncKanban(); else pollNotify();
  }, 60000);
  // 👀 กลับมาที่แท็บ → ซิงก์ทันที ไม่ต้องรอรอบถัดไป
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){ if(CUR==='tasks') syncKanban(); else pollNotify(); } });
  window.addEventListener('focus',function(){ if(CUR==='tasks') syncKanban(); });
}
/* ⚡ ซิงก์บอร์ดเงียบๆ — วาดใหม่เฉพาะเมื่อข้อมูลเปลี่ยนจริง (ไม่กระพริบ ไม่ขัดจังหวะการพิมพ์) */
var KAN_SIG='', MUT=0, INFLIGHT=0;
/* 🚦 กันคำสั่งซ้อน — ยิงพร้อมกันเกิน 2 คำสั่ง Apps Script จะเข้าคิวจนหน้าเว็บค้าง */
function busyNet(){ return INFLIGHT>=2; }
function netDone(){ INFLIGHT=Math.max(0,INFLIGHT-1); }   // กันตัวนับติดลบ
function mutBusy(){ return MUT && (Date.now()-MUT)<12000; }   // มี mutation ค้าง <12 วิ → poll ห้ามทับ
function kanSig(d){ try{ return (d.today||[]).map(function(x){return x.row+':'+x.status+':'+(''+x.item).length;}).join('|'); }catch(e){ return ''; } }
function syncKanban(fresh){
  if(!fresh && (mutBusy()||busyNet())) return;                 // 🚦 คิวเต็ม/กำลังบันทึก → ข้ามรอบนี้
  INFLIGHT++;
  run('ws_kanban',TOKEN,!!fresh).then(function(r){ netDone(); if(!r||!r.ok) return;
    var sig=kanSig(r);
    KAN=r; try{ localStorage.setItem(kanSnapKey(),JSON.stringify({t:Date.now(),d:r})); }catch(e){}
    paintBell();
    var modalOpen=!!document.querySelector('#taskModal:not(.hide)');
    if(sig!==KAN_SIG && CUR==='tasks' && !modalOpen){ KAN_SIG=sig; paintKanban(); }
    else KAN_SIG=sig;
  }).catch(function(){ netDone(); });
}
function notify(title,body,tag){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ var n=new Notification(title,{body:body,icon:'https://lh3.googleusercontent.com/d/1XZ8=w80',badge:'',tag:tag||'mersi',renotify:true});
    n.onclick=function(){ window.focus(); n.close(); }; }catch(e){}
}
function pollNotify(){
  if(busyNet()) return;                                 // 🚦 คิวเต็ม → ข้าม
  INFLIGHT++;
  if(document.hidden===false && CUR==='home') return;                        // อยู่หน้าหลักเห็นอยู่แล้ว ไม่ต้อง notify
  run('ws_dash',TOKEN).then(function(d){ netDone(); if(!d||!d.ok) return;
    var seen=seenIds();
    var newAsg=(d.assignments||[]).filter(function(a){ return String(a.status).indexOf('DONE')<0 && seen.indexOf(a.id)<0; });
    var oldT=(DASH.hub&&DASH.hub.today)?DASH.hub.today.logs:0;
    var newT=(d.hub&&d.hub.today)?d.hub.today.logs:0;
    DASH=d; saveSnap(d); paintBell();
    if(newAsg.length) notify('📌 งานใหม่ '+newAsg.length+' งาน',(newAsg[0].title||'')+(newAsg.length>1?' และอีก '+(newAsg.length-1)+' งาน':''),'new-asg');
    if(newT>oldT && oldT>0) notify('📊 ทีมลงงานเพิ่ม','วันนี้ทีมลงงาน '+newT+' รายการ','team-log');
    // (ตัดการยิง ws_kanban ซ้อนออก — syncKanban ดูแลอยู่แล้ว)
  }).catch(function(){ netDone(); });
}
function buildNav(){
  var items=[['home','🏠','หน้าหลัก'],['report','📊','Dashboard'],['tasks','✅','งาน/Kanban'],['assign','➕','มอบหมาย'],
             ['planner','📆','Content Planner'],['teams','👥','ทีม'],['cal','📅','ปฏิทิน'],['feed','📢','ประกาศ']];
  if(ME.isBoss){ items.splice(4,0,['approve','👑','Approve Flow']); items.splice(7,0,['team','🏆','Leaderboard']); }
  /* 📈 Marketing Hub — วางใต้เมนู "ปฏิทิน" */
  var iCal=items.map(function(x){return x[0];}).indexOf('cal');
  items.splice(iCal<0?items.length:iCal+1, 0, ['hub','📈','Marketing Hub']);
  if(ME.isIT||ME.isBoss) items.push(['users','🛠️','จัดการผู้ใช้']);      // 🛠️ IT / หัวหน้า
  el('nav').innerHTML=items.map(function(x){return '<a data-v="'+x[0]+'" onclick="go(\''+x[0]+'\')"><span class="ic">'+x[1]+'</span><span class="t">'+x[2]+'</span></a>'}).join('')+
    '<div class="foot"><a onclick="openProfile()"><span class="ic">⚙️</span><span class="t">โปรไฟล์</span></a></div>';
}
function setActive(){[].forEach.call(document.querySelectorAll('.nav a[data-v]'),function(a){a.classList.toggle('on',a.getAttribute('data-v')===CUR)})}
var TITLES={home:'หน้าหลัก · Daily Hub',tasks:'งาน / Kanban',daily:'Daily ของฉัน',cal:'ปฏิทินของฉัน',team:'🏆 Leaderboard',teams:'👥 ทีมทั้งหมด',report:'📊 Dashboard & Reporting',assign:'มอบหมายงาน',feed:'ประกาศทีม',approve:'✅ Approve Flow',planner:'📆 Content Planner',users:'🛠️ จัดการผู้ใช้ (IT)',hub:'📈 Marketing Hub'};

/* ---------- DATA ---------- */
/* ⚡ แสดงผลทันทีจากข้อมูลที่เก็บไว้ในเครื่อง แล้วค่อยดึงของใหม่เบื้องหลัง (stale-while-revalidate) */
function saveSnap(d){ try{ localStorage.setItem('mersi_snap',JSON.stringify(d)); }catch(e){} }
function loadSnap(){ try{ var s=localStorage.getItem('mersi_snap'); return s?JSON.parse(s):null; }catch(e){ return null; } }
function loadDash(){
  var snap=loadSnap();
  if(snap && snap.user && snap.user.username===ME.username){      // มีของเก่า → โชว์เลย ไม่ต้องรอ
    DASH=snap; paintBell(); go('home');
    el('pageTitle').innerHTML=TITLES.home+' <span style="font-size:11px;color:#a9b0a3;font-weight:400">· กำลังอัปเดต…</span>';
  } else el('content').innerHTML='<div class="loading">กำลังโหลด…</div>';
  run('ws_dash',TOKEN).then(function(d){ if(!d||!d.ok){ if(!snap)showLogin(); return; }
    DASH=d; saveSnap(d); paintBell();
    if(CUR==='home') renderHome();
    el('pageTitle').textContent=TITLES[CUR]||CUR;
    // ⚡ prefetch "ขนานกัน" ทั้ง 3 ตัว (เดิมรอทีละตัว 0.2→0.9→1.6 วิ = ช้ากว่า 3 เท่า)
    run('ws_kanban',TOKEN).then(function(r){ if(r&&r.ok){ KAN=r;
      try{ localStorage.setItem(kanSnapKey(),JSON.stringify({t:Date.now(),d:r})); }catch(e){}
      if(CUR==='tasks') paintKanban(); } });
    if(!DASH.report) run('ws_report',TOKEN).then(function(r){ if(r&&r.ok) DASH.report={all:r.all,byPerson:r.byPerson}; });
    if(!DASH.teamDaily) run('ws_teamDaily',TOKEN).then(function(r){ if(r&&r.ok) DASH.teamDaily=r.teamDaily; });
  });
}
/* โหลดเฉพาะตอนเปิดแท็บนั้น (แคชในหน่วยความจำ ไม่ยิงซ้ำ) */
function needReport(cb){ if(DASH.report) return cb();
  run('ws_report',TOKEN).then(function(r){ DASH.report=(r&&r.ok)?{all:r.all,byPerson:r.byPerson}:{all:{},byPerson:[]}; cb(); }); }
function needTeamDaily(cb){ if(DASH.teamDaily) return cb();
  run('ws_teamDaily',TOKEN).then(function(r){ DASH.teamDaily=(r&&r.ok)?r.teamDaily:{}; cb(); }); }

/* ---------- 🔔 NOTIFICATION — งานใหม่ที่มอบให้ฉัน (ยังไม่เคยเปิดดู) ---------- */
function seenIds(){ try{ return JSON.parse(localStorage.getItem('mersi_seen')||'[]'); }catch(e){ return []; } }
function newTasks(){ var s=seenIds();
  return (DASH.assignments||[]).filter(function(a){ return String(a.status).indexOf('DONE')<0 && s.indexOf(a.id)<0; }); }
/* 🔴 งานที่ถูกสั่งให้แก้ + 👁️ งานที่รอเราตรวจ — เดิมไม่มีการแจ้งเตือนเลย */
function myRevisions(){ return ((KAN&&KAN.today)||[]).filter(function(x){ return dStatusKey(x)==='revision'; }); }
function myReviewQueue(){ return ((KAN&&KAN.today)||[]).filter(function(x){
  return (''+x.taskId).indexOf('APR-')===0 && dStatusKey(x)!=='approve' && dStatusKey(x)!=='done'; }); }
function paintBell(){ var n=newTasks().length+myRevisions().length+myReviewQueue().length, d=el('bdot'); if(!d) return;
  if(n>0){ d.textContent=n>9?'9+':n; d.classList.remove('hide'); } else d.classList.add('hide'); }
function openNotif(){
  var list=newTasks(), rev=myRevisions(), rq=myReviewQueue();
  var h='<h2 style="margin:0 0 2px">🔔 ต้องทำ</h2><div class="subtle" style="margin-bottom:12px">'+
    (rev.length?'<b style="color:#a94a3f">✏️ ให้แก้ '+rev.length+'</b> · ':'')+
    (rq.length?'<b style="color:#6f47a8">👁️ รอฉันตรวจ '+rq.length+'</b> · ':'')+
    '📌 งานใหม่ '+list.length+' <small>— แตะเพื่อเปิดในกระดาน</small></div>'+
    '<div style="max-height:60vh;overflow:auto">';
  /* 🔴 งานที่หัวหน้าสั่งให้แก้ — สำคัญสุด ขึ้นบนสุด */
  if(rev.length){ h+='<div style="font-size:12px;font-weight:800;color:#a94a3f;margin:4px 0">✏️ ต้องแก้ไข</div>';
    rev.forEach(function(x){ h+='<div class="li" style="padding:9px 10px;cursor:pointer;border-radius:8px;background:#fde5e0;margin-bottom:5px" onclick="closeTask();go(\'tasks\');setTimeout(function(){openCard('+x.row+')},450)">'+
      '<b>'+esc(parseItem(x.item).text.slice(0,80))+'</b></div>'; }); }
  if(rq.length){ h+='<div style="font-size:12px;font-weight:800;color:#6f47a8;margin:8px 0 4px">👁️ รอฉันตรวจ</div>';
    rq.forEach(function(x){ h+='<div class="li" style="padding:9px 10px;cursor:pointer;border-radius:8px;background:#f4f0fb;margin-bottom:5px" onclick="closeTask();go(\'tasks\');setTimeout(function(){openCard('+x.row+')},450)">'+
      '<b>'+esc(parseItem(x.item).text.slice(0,80))+'</b></div>'; }); }
  if(list.length&&(rev.length||rq.length)) h+='<div style="font-size:12px;font-weight:800;color:#617350;margin:8px 0 4px">📌 งานใหม่ที่ได้รับมอบ</div>';
  if(list.length){ list.forEach(function(a){
    h+='<div class="li" style="padding:10px;cursor:pointer;border-radius:8px;transition:background .15s" onmouseover="this.style.background=\'#f4f7ef\'" onmouseout="this.style.background=\'\'" onclick="notifOpen(\''+esc(a.id)+'\')">'+
       '<b style="color:#617350">'+esc(a.title)+'</b> <small style="color:#8b9284">→</small><br>'+pill(a.status)+
       ' <small>⏰ '+esc(a.due||'-')+' · มอบโดย '+esc(a.by||'-')+(a.note?' · '+esc(a.note):'')+'</small></div>'; });
  } else h+='<p style="color:#889">ไม่มีงานใหม่ 🎉</p>';
  h+='</div><div style="display:flex;gap:8px;margin-top:12px">'+
     (list.length?'<button class="btn" style="flex:1" onclick="markSeen()">✓ รับทราบทั้งหมด</button>':'')+
     '<button class="btn ghost" style="flex:1" onclick="closeTask()">ปิด</button></div>';
  el('taskBody').innerHTML=h; el('taskModal').classList.remove('hide');
}
/* 🎯 คลิกงานใน bell notif → เปิดการ์ดใน Kanban ทันที (ถ้าเจอ) · ไม่งั้นเปิด assignment modal */
function notifOpen(taskId){
  // mark เฉพาะใบนี้ว่าเห็นแล้ว
  var s=seenIds(); if(s.indexOf(taskId)<0){ s.push(taskId); try{ localStorage.setItem('mersi_seen',JSON.stringify(s)); }catch(e){} paintBell(); }
  // หา row ใน DAILY (Kanban) ที่มี taskId ตรง
  var rowFound=0;
  try{ var pools=[(KAN&&KAN.today)||[], (KAN&&KAN.yesterday)||[]];
    for(var p=0;p<pools.length&&!rowFound;p++){
      for(var i=0;i<pools[p].length;i++){ if((''+pools[p][i].taskId||'')===taskId){ rowFound=pools[p][i].row; break; } }
    }
  }catch(e){}
  closeTask();
  if(rowFound){                                          // 🎯 เปิดการ์ด Kanban ตรงเลย
    if(CUR!=='tasks') go('tasks');
    setTimeout(function(){ openCard(rowFound); }, CUR==='tasks'?60:400);
  } else {                                                // 🔄 ยังไม่มีใน Kanban → เปิด assignment view
    setTimeout(function(){ if(typeof openTask==='function') openTask(taskId); }, 60);
  }
}
function markSeen(){ var s=seenIds();
  (DASH.assignments||[]).forEach(function(a){ if(s.indexOf(a.id)<0) s.push(a.id); });
  try{ localStorage.setItem('mersi_seen',JSON.stringify(s)); }catch(e){}
  paintBell(); closeTask();
}
function go(v){CUR=v;setActive();el('pageTitle').textContent=TITLES[v]||v;closeSide();ROUTE[v]();}
var ROUTE={
  home:function(){renderHome()}, tasks:function(){renderKanbanTab()}, daily:function(){renderDaily()},
  cal:function(){renderCal()},
  teams:function(){ renderTeams(); },
  report:function(){ el('content').innerHTML='<div class="loading">กำลังโหลด…</div>'; needReport(renderReport); },
  team:function(){renderTeam()}, assign:function(){renderAssign()}, feed:function(){renderFeed()},
  approve:function(){renderApprove()}, planner:function(){renderPlanner()}, users:function(){renderUsers()},
  hub:function(){renderHub()}
};

/* ---------- HOME = DAILY HUB (ทุกคนลงงานทุกวันที่นี่) ---------- */
function renderHome(){
  var u=ME,s=DASH.stats||{},hub=DASH.hub||{},T=hub.today||{},recent=hub.recent||[];
  var html='<div class="box" style="margin-bottom:16px;display:flex;align-items:center;gap:16px">'+
    '<div class="bigav" style="width:60px;height:60px;font-size:24px;margin:0">'+avatarHTML(u)+'</div>'+
    '<div><div class="hello">สวัสดี, '+esc(u.name)+' 👋</div><div class="subtle">'+esc(u.role==="supervisor"?"หัวหน้าทีม":u.dept)+' · วันนี้ทีมลงงานแล้ว '+esc(T.logs||0)+' รายการ</div></div></div>';
  // KPI วันนี้ (จาก DAILY hub)
  html+='<div class="cards">'+card(T.logs||0,'📅 Daily วันนี้')+card(T.people||0,'👥 คนที่ลงงาน')+card(T.done||0,'✅ Done')+card(T.doing||0,'🔄 Doing')+card(T.blocker||0,'🚧 Blocker')+card(T.need||0,'📌 Need Support')+'</div>';
  // ลง Daily + สตรีมทีม
  html+='<div class="grid2">'+
    '<div class="box"><h3>📝 ลง Daily วันนี้ <small>— ทุกคนลงทุกวัน เข้า 📅 DAILY UPDATES</small></h3>'+
      '<label>✅ Done (บรรทัดละงาน)</label><textarea id="dDone" rows="3" placeholder="งานที่ทำเสร็จวันนี้..."></textarea>'+
      '<label>🔄 กำลังทำ (Doing)</label><textarea id="dDoing" rows="2"></textarea>'+
      '<label>🚧 ติดปัญหา (Blocker)</label><textarea id="dBlk" rows="2"></textarea>'+
      '<label>📌 ต้องการความช่วยเหลือ (Need Support)</label><textarea id="dNeed" rows="2"></textarea>'+
      '<button class="btn" onclick="sendDaily()">ส่งเข้า Daily Hub</button> <span id="dMsg" style="color:#27ae8f;font-weight:700"></span></div>'+
    '<div class="box"><h3>🔔 ความเคลื่อนไหวทีมล่าสุด</h3><div class="stream">'+
      (recent.length?recent.slice(0,20).map(function(r){return '<div class="row"><div class="who">'+esc(r.nick)+'</div><div class="it">'+esc(r.item)+'<br>'+pill(r.status)+' <small>'+esc(r.date)+'</small></div></div>'}).join(''):'<p style="color:#889">ยังไม่มีการลงงานวันนี้</p>')+
      '</div></div></div>';
  // ส่วนเสริม: งานที่มอบหมาย
  html+='<div class="box" style="margin-top:16px"><h3>🗂️ งานที่มอบหมายให้ฉัน <small>— ส่วนเสริม</small></h3>'+(DASH.assignments.length?kanbanRO(DASH.assignments):'<p style="color:#889">ยังไม่มีงานมอบหมาย</p>')+'</div>';
  el('content').innerHTML=html;
}
function card(n,l){return '<div class="card"><div class="n">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></div>'}

/* ---------- KANBAN ---------- */
function stKey(st){st=''+st;if(st.indexOf('DOING')>-1||st.indexOf('PROGRESS')>-1)return'doing';if(st.indexOf('REVIEW')>-1)return'review';if(st.indexOf('DONE')>-1)return'done';if(st.indexOf('BLOCK')>-1)return'blocked';return'todo'}
function renderKanban(asg,editable){
  var html='<div class="kan">'+COLS.map(function(c){
    var cs=asg.filter(function(a){return stKey(a.status)===c[1]}).map(function(a){
      return kcWrap(esc(a.title)+
      '<div class="m">'+(a.assignee?'👤 '+esc(a.assignee)+' · ':'')+'⏰ '+esc(a.due||'-')+'</div>'+
      '<div class="m">'+(a.folder?'<a href="'+esc(a.folder)+'" target="_blank">📁 โฟลเดอร์</a> ':'')+
        (a.submitted?'<a href="'+esc(a.submitted)+'" target="_blank" style="color:#27ae8f">✅ งานที่ส่ง</a>':'<span style="color:var(--pri);cursor:pointer" onclick="event.stopPropagation();submitWork(\''+esc(a.id)+'\')">📤 ส่งงาน</span>')+'</div>',
      c[2],' draggable="'+(editable?'true':'false')+'" data-id="'+esc(a.id)+'" ondragstart="dStart(event)" onclick="openTask(\''+esc(a.id)+'\')"')}).join('');
    return '<div class="col" data-k="'+c[1]+'" ondragover="dOver(event)" ondragleave="dLeave(event)" ondrop="dDrop(event)"><h4 style="background:'+c[2]+'">'+c[0]+'</h4>'+cs+'</div>'}).join('')+'</div>';
  el('content').innerHTML=html+'<p style="color:#889;font-size:12px">ลากการ์ดข้ามคอลัมน์เพื่อเปลี่ยนสถานะ</p>';
}
function kanbanRO(asg){return '<div class="kan">'+COLS.slice(0,4).map(function(c){
  var cs=asg.filter(function(a){return stKey(a.status)===c[1]}).map(function(a){return kcWrap(esc(a.title)+'<div class="m">⏰ '+esc(a.due||'-')+'</div>',c[2],' onclick="openTask(\''+esc(a.id)+'\')" style="cursor:pointer"')}).join('');
  return '<div class="col"><h4 style="background:'+c[2]+'">'+c[0]+'</h4>'+cs+'</div>'}).join('')+'</div>';}
/* 🃏 helper — ครอบเนื้อหาการ์ดเก่าให้เข้าโครง Trello (.kcBody + แถบสี) */
function kcWrap(inner,color,attrs){
  return '<div class="kc"'+(attrs||'')+'><div class="kcBody">'+
    (color?'<div class="kcLabels"><span class="kcLabel" style="background:'+color+'"></span></div>':'')+
    inner+'</div></div>';
}
var DRAG=null;
function dStart(e){DRAG=e.target.getAttribute('data-id');e.dataTransfer.effectAllowed='move'}
function dOver(e){e.preventDefault();e.currentTarget.classList.add('drag')}
function dLeave(e){e.currentTarget.classList.remove('drag')}
function dDrop(e){e.preventDefault();e.currentTarget.classList.remove('drag');var k=e.currentTarget.getAttribute('data-k');
  var list=ME.isBoss&&CUR==='tasks'?DASH.allAssignments:DASH.assignments; list.forEach(function(a){if(a.id===DRAG)a.status=MAPU[k]});
  renderKanban(list,true);run('ws_setTaskStatus',TOKEN,DRAG,MAPU[k]);}

/* ---------- KANBAN รายวัน (จาก DAILY: เมื่อวาน/วันนี้) ---------- */
var KAN=null, KDRAG=null;
/* ⚡ stale-while-revalidate — เปิดแท็บเห็นบอร์ดทันทีจากแคชในเครื่อง แล้วค่อยซิงก์ของใหม่เงียบๆ */
function kanSnapKey(){ return 'mersi_kan_'+(ME&&ME.username||'x'); }
function renderKanbanTab(){
  var snap=KAN;                                                       // ใช้ของในหน่วยความจำก่อน (สดกว่า)
  if(!snap){ try{ var s=localStorage.getItem(kanSnapKey()); if(s){ var o=JSON.parse(s);
    /* 🐞 FIX: อายุ snapshot 6 ชม. → 3 นาที (เลข row เก่าทำให้แก้ผิดใบ) */
    if(o && o.t && (Date.now()-o.t)<180000) snap=o.d; } }catch(e){} }
  if(snap){ KAN=snap; paintKanban();                                  // 🚀 วาดทันที 0ms
    var h=el('content').querySelector('h3'); if(h) h.insertAdjacentHTML('beforeend',' <small id="kanSync" style="color:#a9b0a3;font-weight:400">· กำลังซิงก์…</small>');
  } else {
    el('content').innerHTML='<div class="skel" style="height:52px;margin-bottom:14px"></div>'+
      '<div class="skelBoard">'+[1,2,3,4].map(function(){ return '<div><div class="skel" style="height:34px;margin-bottom:8px"></div>'+
        '<div class="skel" style="height:76px;margin-bottom:8px"></div><div class="skel" style="height:58px"></div></div>'; }).join('')+'</div>';
  }
  run('ws_kanban',TOKEN).then(function(d){
    if(!d||!d.ok){ var sy=el('kanSync'); if(sy) sy.textContent='· ออฟไลน์'; return; }
    KAN=d; try{ localStorage.setItem(kanSnapKey(),JSON.stringify({t:Date.now(),d:d})); }catch(e){}
    if(CUR==='tasks') paintKanban();
  }); }
var KFILTER='', KVIEW='', KLIMIT={};
/* 🎨 คอลัมน์ — Done ใช้ไล่เฉดเขียว→ม่วง Approve สื่อว่า "เสร็จแล้ว รอคุณธีร์อนุมัติ" */
function dkCols(){ return [['todo','📋 TODO','#9aa7a3'],['doing','🔄 Doing','#e0a417'],
  ['done','✅ Done · ⏳ รอ Approve','linear-gradient(90deg,#27ae8f 0%,#5b8fb9 55%,#8a5cd0 100%)'],
  ['revision','✏️ Revision','#cf6a5e'],['approve','👑 Approve · วันนี้','#8a5cd0'],['blocker','🚧 Blocker','#e2574f'],['need','📌 Need','#3a6bd0']]; }
function dStatusKey(x){ var c=(''+x.status)+' '+(''+x.cat);
  if(c.indexOf('REVISION')>-1||c.indexOf('Revision')>-1)return'revision';
  if(c.indexOf('APPROVE')>-1||c.indexOf('Approve')>-1)return'approve';
  if(c.indexOf('DONE')>-1||c.indexOf('Done')>-1)return'done';
  if(c.indexOf('NEED')>-1||c.indexOf('Need')>-1)return'need';
  if(c.indexOf('BLOCK')>-1||c.indexOf('Blocker')>-1)return'blocker';
  if(c.indexOf('TODO')>-1)return'todo';
  return'doing'; }
function dColor(x){ var m={todo:'#9aa7a3',doing:'#e0a417',done:'#27ae8f',revision:'#cf6a5e',approve:'#8a5cd0',blocker:'#e2574f',need:'#3a6bd0'}; return m[dStatusKey(x)]||'#9aa7a3'; }
/* 🏷️ สีที่ 2 ของการ์ด Done = ม่วง Approve (บอกว่ากำลังรออนุมัติ) */
function paintKanban(){
  var k=KAN||{today:[],yesterday:[]};
  k={carried:k.carried, carryDays:k.carryDays, todayStr:k.todayStr,
     total:k.total, trimmed:k.trimmed, yesterday:k.yesterday||[],   // 🐞 เดิมตกไป → แบนเนอร์ไม่แสดง
     today:mergePending(k.today||[])};      // 🛡️ เติมการ์ดที่รอเซิร์ฟเวอร์ยืนยันกลับเข้าบอร์ดเสมอ
  /* 🔁 แบนเนอร์งานที่ยกมาจากวันก่อน (ยังไม่ Approve จึงติดบอร์ดอยู่) */
  var html='';
  var nCarry=k.carried||0, nPend=(k.today||[]).filter(function(x){return dStatusKey(x)==='done';}).length;
  if(k.trimmed>0){
    html+='<div class="box" style="margin-bottom:10px;padding:9px 14px;border-left:4px solid #d9a441;font-size:12.5px">'+
      '⚡ <b>แสดง '+(k.today||[]).length+' ใบล่าสุด</b> จากทั้งหมด '+k.total+' ใบ '+
      '<small style="color:#8b9284">— ซ่อน '+k.trimmed+' ใบเก่าเพื่อให้บอร์ดลื่น · ดูย้อนหลังได้ที่ 📊 Dashboard</small></div>';
  }
  if(nCarry||nPend){
    html+='<div class="box" style="margin-bottom:12px;padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-left:4px solid #8a5cd0">'+
      (nCarry?'<span style="font-size:13px"><b style="color:#9b6f1c">🔁 ยกมา '+nCarry+' งาน</b> <small style="color:#8b9284">— ยังไม่ผ่าน Approve จึงติดบอร์ดต่อ (ย้อนได้ '+(k.carryDays||14)+' วัน)</small></span>':'')+
      (nPend?'<span style="font-size:13px"><b style="color:#6f47a8">⏳ รอ Approve '+nPend+' งาน</b> <small style="color:#8b9284">— ส่งตรวจแล้ว รอคุณธีร์อนุมัติ</small></span>':'')+
      '</div>';
  }
  html+='<h3 style="margin:2px 0 10px">📌 กระดานงาน ('+esc(k.todayStr||'-')+') <small style="color:#8b9284;font-weight:400">— แตะการ์ดแก้ไข · ลากเปลี่ยนสถานะ · <b>+ เพิ่มการ์ด</b></small></h3>'+
  /* 🔍 Toolbar — ค้นหาการ์ด (Trello-style filter) */
  '<div class="ktools"><div class="ksearch"><input id="kq" placeholder="ค้นหาการ์ด…" value="'+esc(KFILTER)+'" oninput="kqType(this.value)"></div>'+
  (KFILTER?'<button class="kchip on" onclick="KFILTER=\'\';paintKanban()">✕ ล้างค้นหา</button>':'')+
  /* 👁️ คิวงานรอตรวจ (สำหรับนีร/ผู้ตรวจ) + 🔴 งานที่ต้องแก้ */
  (function(){ var rq=myReviewQueue().length, rv=myRevisions().length, o='';
    if(rq) o+='<button class="kchip'+(KVIEW==='review'?' on':'')+'" onclick="KVIEW=(KVIEW===\'review\'?\'\':\'review\');paintKanban()" style="border-color:#8a5cd0;color:'+(KVIEW==='review'?'#fff':'#6f47a8')+'">👁️ รอฉันตรวจ '+rq+'</button>';
    if(rv) o+='<button class="kchip'+(KVIEW==='rev'?' on':'')+'" onclick="KVIEW=(KVIEW===\'rev\'?\'\':\'rev\');paintKanban()" style="border-color:#cf6a5e;color:'+(KVIEW==='rev'?'#fff':'#a94a3f')+'">✏️ ต้องแก้ '+rv+'</button>';
    return o; })()+'</div>'+
  '<div class="kan">'+dkCols().map(function(c){
    var items=(k.today||[]).filter(function(x){return dStatusKey(x)===c[0]});
    if(KFILTER){ var q=KFILTER.toLowerCase();
      items=items.filter(function(x){ var p=parseItem(x.item);        // 🔍 ค้นเฉพาะข้อความ ไม่รวม URL/checklist JSON
        return (p.text||'').toLowerCase().indexOf(q)>-1 || (''+x.taskId).toLowerCase().indexOf(q)>-1; }); }
    if(KVIEW==='review') items=items.filter(function(x){ return (''+x.taskId).indexOf('APR-')===0; });
    else if(KVIEW==='rev') items=items.filter(function(x){ return dStatusKey(x)==='revision'; });
    // 🚧 วาดทีละ 30 ใบ (กันเบราว์เซอร์ค้างเวลามีงานเยอะ) · 🖼️ โหลดรูปปกแค่ 6 ใบแรก
    var lim=(KLIMIT[c[0]]||30), shown=items.slice(0,lim), more=items.length-shown.length;
    var cs=items.length?(shown.map(function(x,ci){ return trelloCard(x,c[2],ci<6); }).join('')+

function dlChip(x){ var t=x.due||'';
  if(!t){ var txt=(''+x.item).replace(/(?:🔗\s*)?https?:\/\/[^\s]+/g,'').trim();
    var m=txt.match(/\((\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\)\s*$/); if(m) t=m[1]+'/'+m[2]; }
  if(!t) return '';
  /* ⏰ สีตามความเร่งด่วน — เลยกำหนด=แดง · วันนี้=เหลือง (Trello-style) */
  var cls='';
  try{ var mm=(''+t).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
    if(mm){ var now=new Date(); var y=mm[3]?+mm[3]:now.getFullYear(); if(y>2400)y-=543;
      var due=new Date(y,+mm[2]-1,+mm[1]);
      var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
      var isDone=/DONE|Done/.test((''+x.status)+(''+x.cat));
      if(!isDone){ if(due<t0) cls=' over'; else if(due.getTime()===t0.getTime()) cls=' today'; }
    } }catch(e){}
  return '<span class="duechip'+cls+'">⏰ '+esc(t)+(cls===' over'?' เลยกำหนด':'')+'</span>'; }

      var p=parseItem((''+x.item).replace(/^🔴\s*/,'')); if(!p.imgs.length && !p.links.length) return '';
      var out='<div style="background:#f4f7ef;border-radius:9px;padding:8px 10px;margin:-4px 0 10px"><div style="font-size:12px;color:#8b9284;font-weight:700;margin-bottom:6px">📎 ไฟล์/ลิงก์ในการ์ดนี้</div>';
      if(p.imgs.length){ out+='<div class="thumbs" style="margin:0 0 6px">'+p.imgs.map(function(im,i){
        return '<a href="https://drive.google.com/file/d/'+im.id+'/view?usp=drive_link" target="_blank" onclick="event.stopPropagation()" class="thumbA" title="ภาพ #'+(i+1)+' (คลิกเปิด)">'+

      if(p.links.length){ out+='<div style="display:flex;flex-direction:column;gap:4px">'+p.links.map(function(u,i){
        var short=u.length>50?u.substr(0,47)+'…':u;

        '<textarea id="apRevN" rows="2" placeholder="'+(ME.isBoss?'พิมพ์ Comment สำหรับทีม (ถ้าให้แก้จะขึ้นแดง)':'ระบุจุดที่ให้แก้ หรือ note ถึง MD')+'"></textarea>'+
        '<div style="display:flex;gap:8px;margin-top:6px"><button class="btn g" style="flex:1" onclick="kanDecide('+row+',\'approve\')">✅ อนุมัติ</button>'+

    '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="saveCard('+row+')">💾 บันทึก + แนบไฟล์/ลิงก์</button>'+

  el('taskBody').innerHTML=h; el('taskModal').classList.remove('hide');

/* ☑️ Checklist state + UI (Trello-style) */
var CHK_STATE={row:0, items:[]};
function renderChk(){ var box=el('ecChk'); if(!box) return;
  var d=CHK_STATE.items.filter(function(c){return c.d;}).length, all=CHK_STATE.items.length;
  var bar=all?'<div style="background:#e6e9e0;border-radius:4px;height:6px;overflow:hidden;margin-bottom:6px"><div style="background:#6f9e63;height:100%;width:'+Math.round(d*100/all)+'%"></div></div>':'';
  var list=CHK_STATE.items.map(function(c,i){
    return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0"><input type="checkbox" '+(c.d?'checked':'')+' onchange="chkTog('+i+')" style="cursor:pointer;width:16px;height:16px">'+
      '<span style="flex:1;color:'+(c.d?'#8b9284':'#2a3128')+';text-decoration:'+(c.d?'line-through':'none')+'">'+esc(c.t)+'</span>'+
      '<button onclick="chkDel('+i+')" style="border:none;background:none;color:#cf6a5e;cursor:pointer;font-size:16px" title="ลบ">×</button></div>';
  }).join('');
  box.innerHTML='<label>☑️ Checklist <small style="color:#8b9284;font-weight:400">'+(all?d+'/'+all:'— ยังไม่มี')+'</small></label>'+bar+
    '<div style="background:#f4f7ef;border-radius:9px;padding:6px 10px">'+list+
    '<div style="display:flex;gap:6px;margin-top:'+(all?'4':'0')+'px"><input id="chkNew" placeholder="เพิ่มรายการ… (Enter)" onkeydown="if(event.key===\'Enter\')chkAdd()" style="flex:1;font-size:13px">'+
    '<button class="btn" style="background:#617350;padding:6px 10px" onclick="chkAdd()">＋</button></div></div>';
}
function chkAdd(){ var v=(el('chkNew')&&el('chkNew').value||'').trim(); if(!v) return;
  CHK_STATE.items.push({t:v,d:false}); renderChk(); chkSave(); setTimeout(function(){var i=el('chkNew');if(i){i.value='';i.focus();}},50); }
function chkTog(i){ if(!CHK_STATE.items[i])return; CHK_STATE.items[i].d=!CHK_STATE.items[i].d; renderChk(); chkSave(); }
function chkDel(i){ CHK_STATE.items.splice(i,1); renderChk(); chkSave(); }
function chkSave(){ run('ws_setChecklist',TOKEN,CHK_STATE.row,CHK_STATE.items).then(function(r){
  // optimistic — อัปเดต card local ให้ progress ตรง (จะเห็นบน UI หลังปิด modal)
  var c=findCard(CHK_STATE.row); if(c){ var it=c.item.replace(/⧉CHK⧉[^⧉]*⧉/,''); c.item=(CHK_STATE.items.length?'⧉CHK⧉'+JSON.stringify(CHK_STATE.items)+'⧉':'')+it; }
}); }
/* 💬 Comment — ทุกคนโพสต์ได้ */
function addCom(row){ var t=(el('ecCom')&&el('ecCom').value||'').trim(); if(!t){el('ecMsg').textContent='พิมพ์ข้อความก่อน';return;}
  el('ecMsg').style.color='#8b9284'; el('ecMsg').textContent='กำลังโพสต์…';
  run('ws_addComment',TOKEN,row,t).then(function(r){
    if(!r||!r.ok){el('ecMsg').style.color='#cf6a5e';el('ecMsg').textContent=(r&&r.err)||'โพสต์ล้มเหลว';return;}
    el('ecCom').value=''; el('ecMsg').style.color='#4d7343'; el('ecMsg').textContent='💬 โพสต์แล้ว';
    // reload history
    run('ws_cardHistory',TOKEN,row).then(function(rr){
      if(!rr||!rr.ok) return; var box=el('ecHist'); if(!box) return;
      var rows=(rr.items||[]).map(function(h){
        var color=h.act.indexOf('อนุมัติ')>-1?'#6f9e63':(h.act.indexOf('แก้')>-1?'#cf6a5e':(h.act.indexOf('COMMENT')>-1||h.act==='💬'?'#617350':'#8a5cd0'));
        return '<div style="border-left:3px solid '+color+';padding:6px 10px;margin:4px 0;background:#fff;border-radius:6px;font-size:13px">'+
          '<div style="color:#8b9284;font-size:11px">'+esc(h.when)+' · <b style="color:'+color+'">'+esc(h.who)+'</b> · '+esc(h.act)+'</div>'+
          '<div style="margin-top:2px;color:#2a3128">'+esc(h.note)+'</div></div>';
      }).join('');
      box.innerHTML='<div style="background:#f4f7ef;border-radius:9px;padding:8px 10px"><div style="font-size:12px;color:#8b9284;font-weight:700;margin-bottom:4px">💬 ประวัติ Comment ('+(rr.items||[]).length+')</div>'+rows+'</div>';
    });
  });
}
/* 👑 MD/Head ตัดสินการ์ดใบไหนก็ได้ — เรียก ws_bossDecide (universal) */
function mdDecide(row,dec){ var note=(el('mdBossN')&&el('mdBossN').value||'').trim();
  el('ecMsg').style.color='#8b9284'; el('ecMsg').textContent=(dec==='approve'?'กำลังอนุมัติ':'กำลังส่งกลับให้แก้')+'…';
  run('ws_bossDecide',TOKEN,row,dec,note).then(function(r){
    if(!r||!r.ok){el('ecMsg').style.color='#cf6a5e';el('ecMsg').textContent=(r&&r.err)||'ล้มเหลว';return;}
    toast((dec==='approve'?'อนุมัติแล้ว · แจ้งทีมและอีเมล':'ส่งให้แก้แล้ว · แจ้งทีมและอีเมล'),dec==='approve'?'ok':'info');
    setTimeout(function(){closeTask();syncKanban(true);},350);
  });
}
/* 💾 บันทึกทุกอย่างในปุ่มเดียว — ทำ "ทีละขั้น" (edit → move → attach) กัน race condition ทำ URL หาย */
function saveCard(row){ var it=el('ecItem').value.trim(), st=el('ecSt').value;
  var dEl=el('ecDue'); if(dEl && !dEl.disabled) it=applyDue(it, dEl.value);      // ⏰ ผูก deadline ท้ายชื่องาน
  var extraLink=(el('ecLink')&&el('ecLink').value||'').trim();
  var nFiles=el('ecFiles')&&el('ecFiles').files.length||0;
  if(!it){el('ecMsg').style.color='#cf6a5e';el('ecMsg').textContent='ใส่ชื่องานด้วย';return;}
  el('ecMsg').style.color='#8b9284'; el('ecMsg').textContent='กำลังบันทึก…'+(nFiles?' (อัปโหลด '+nFiles+' ไฟล์)':'');
  readFiles(el('ecFiles'),function(files,readErrs){ if(files===null){el('ecMsg').textContent='';return;}
    // ⚠️ ถ้าเลือกไฟล์ไว้แต่อ่านไม่ได้เลย → หยุด+แสดง reason จริง (ไม่ยิงต่อ)
    if(nFiles>0 && files.length===0){
      el('ecMsg').style.color='#cf6a5e';
      el('ecMsg').innerHTML='⚠️ อ่านไฟล์ไม่สำเร็จ:<br><small>'+esc((readErrs||[]).join(' · ')||'ไม่ทราบสาเหตุ')+'</small><br><small>ลองเบราว์เซอร์อื่น หรือลากไฟล์ใส่ใหม่</small>';
      return;
    }
    var c=findCard(row); if(c){ c.item=it; c.cat=KMAP[st][0]; c.status=KMAP[st][1]; }
    // ⚠️ ต้องรันทีละขั้น (sequential) — เดิม Promise.all ทำ edit เขียนทับ attach → URL หาย
    run('ws_dailyEdit',TOKEN,row,it).then(function(r){
      if(!r||!r.ok) throw new Error((r&&r.err)||'edit fail');
      return run('ws_dailyMove',TOKEN,row,st,'update');
    }).then(function(r){
      if(r&&!r.ok) throw new Error(r.err||'move fail');
      if(extraLink || (files&&files.length)) return run('ws_dailyAttach',TOKEN,row,extraLink,files||[]);
      return {ok:true};
    }).then(function(r){
      if(r&&!r.ok) throw new Error(r.err||'attach fail');
      var attempted=nFiles+(extraLink?1:0), gotN=(r&&r.n)||0, fld=(r&&r.failed)||0;

/* 📎 อ่านไฟล์เป็น base64 — surface error จริงถ้ามี (ไม่ทิ้งเงียบ) */
function readFiles(inp,cb){ var fs=[].slice.call((inp&&inp.files)||[]); if(!fs.length) return cb([]);
  if(fs.length>10){ toast('เลือกได้สูงสุด 10 ไฟล์','err'); return cb(null); }
  var tot=fs.reduce(function(s,f){return s+f.size},0);
  if(tot>25*1024*1024){ toast('ไฟล์รวมกันเกิน 25MB','err'); return cb(null); }
  var out=[],n=0, errs=[];
  fs.forEach(function(f,idx){
    var finished=false, done=function(r,errMsg){ if(finished) return; finished=true;
      if(r) out.push(r); else errs.push('#'+(idx+1)+' '+(f.name||'?')+': '+(errMsg||'unknown'));
      if(++n===fs.length){ if(errs.length) console.warn('📎 readFiles errors:',errs); cb(out,errs); }
    };
    try{ var rd=new FileReader();
      rd.onload=function(ev){ try{
        var res=''+(ev.target&&ev.target.result||'');
        var i=res.indexOf(','); if(i<0){ done(null,'no base64 comma'); return; }
        var b64=res.substr(i+1); if(!b64){ done(null,'empty data'); return; }
        done({name:f.name||('file'+idx),mime:f.type||'application/octet-stream',data:b64});
      }catch(e){ done(null,'parse: '+e.message); } };
      rd.onerror=function(){ done(null,'FileReader.onerror '+(rd.error&&rd.error.name||'')); };
      rd.onabort=function(){ done(null,'aborted'); };
      setTimeout(function(){ if(!finished){ try{rd.abort();}catch(e){} done(null,'timeout 30s'); } },30000);
      rd.readAsDataURL(f);
    }catch(e){ done(null,'sync throw: '+e.message); }
  });
}

function dKey(s){ s=(''+s).toUpperCase();
  if(s.indexOf('ADS')>-1)return'ADS'; if(s.indexOf('CONTENT')>-1)return'CONTENT';
  if(s.indexOf('GRAPHIC')>-1)return'GRAPHIC'; if(s.indexOf('VIDEO')>-1||s.indexOf('EDITOR')>-1)return'VIDEO';
  if(s.indexOf('KOL')>-1)return'KOL';

var NICK_ALIAS={'คุณธีร์':['ธี่','ธีร์','คุณธี','ธี'],'พี่ย้ง':['ย้ง','พี่ยง','ยง'],'นีร':['นีรนารา','นี'],'ธัญ':['ธัญรักษ์','tanyarak']};
function nickIs(a,b){ a=(''+a).trim().toLowerCase(); b=(''+b).trim();
  if(!a) return false; if(a===b.toLowerCase()) return true;
  var k=(NICK_ALIAS[b]||[]).concat([]);
  Object.keys(NICK_ALIAS).forEach(function(m){ if(NICK_ALIAS[m].indexOf(b)>-1){ k.push(m); k=k.concat(NICK_ALIAS[m]); } });
  for(var i=0;i<k.length;i++) if((''+k[i]).toLowerCase()===a) return true;
  return false; }

var APV=[];
function renderApprove(){ el('content').innerHTML='<div class="loading">กำลังโหลด…</div>';
  run('ws_apvList',TOKEN).then(function(r){ APV=(r&&r.ok)?r.items:[]; paintApprove(); }); }
function apvGroup(){
  var me=ME.nick, boss=ME.isBoss;
  var mine=APV.filter(function(x){return x.to===me && x.status==='🎯 DRAFT';});
  var back=APV.filter(function(x){return x.from===me && x.status==='🔁 RETURNED';});
  var pending=boss?APV.filter(function(x){return x.status==='📤 PENDING';}):APV.filter(function(x){return x.approver===me && x.status==='📤 PENDING';});
  var rev=APV.filter(function(x){return x.status==='✏️ REVISION' && (x.to===me||x.from===me||boss);});
  var done=APV.filter(function(x){return x.status==='✅ APPROVED' && (x.from===me||x.to===me||x.approver===me||boss);});
  var need=APV.filter(function(x){return x.status==='📌 NEED';});
  return {mine:mine,back:back,pending:pending,rev:rev,done:done,need:need};
}
function apvCard(x){
  var lk=(x.links||[]).map(function(l){return '<a href="'+esc(l)+'" target="_blank" class="duechip" style="background:#e8eddf;color:#617350;text-decoration:none;margin:2px 4px 2px 0">🔗 ลิงก์</a>';}).join('');
  return kcWrap(esc(x.title)+
    '<div class="m">👤 '+esc(x.from)+' → '+esc(x.to)+(x.approver?' → 👑 '+esc(x.approver):'')+'</div>'+
    (lk?'<div class="m">'+lk+'</div>':'')+
    (x.revNote?'<div class="m" style="color:#cf6a5e">✏️ '+esc(x.revNote)+'</div>':'')+

function apvSend(){ var d={title:el('anTitle').value.trim(),to:el('anTo').value,approver:el('anApv').value,

function apvFind(id){ for(var i=0;i<APV.length;i++) if(APV[i].id===id) return APV[i]; return null; }
function apvOpen(id){ var x=apvFind(id); if(!x) return;
  var me=ME.nick, boss=ME.isBoss;
  var acts=[];
  if(x.status==='🎯 DRAFT' && x.to===me) acts.push(['done','✅ ทำเสร็จ — ส่งกลับให้ตรวจ','g']);
  if(x.status==='🔁 RETURNED' && x.from===me){ acts.push(['pending','📤 ส่งต่อให้ MD/Head อนุมัติ','']); acts.push(['revise','✏️ ให้แก้ไข','r']); }
  if(x.status==='📤 PENDING' && (boss || x.approver===me)){ acts.push(['approve','✅ อนุมัติ','g']); acts.push(['revise','✏️ ขอแก้ไข','r']); }
  if(x.status==='✏️ REVISION' && x.to===me) acts.push(['done','✅ แก้เสร็จแล้ว — ส่งกลับ','g']);
  var bosses=(DASH.teamAll||[]).filter(function(u){return u.isBoss;}).map(function(u){return '<option'+(u.nick===x.approver?' selected':'')+'>'+esc(u.nick)+'</option>'}).join('');
  var lk=(x.links||[]).map(function(l){return '<a href="'+esc(l)+'" target="_blank" class="duechip" style="background:#e8eddf;color:#617350;text-decoration:none;margin:2px 4px 2px 0">🔗 ลิงก์</a>';}).join('');
  var h='<h2 style="margin:0 0 4px">'+esc(x.title)+'</h2>'+

    '<div class="li" style="padding:6px 0">👤 <b>'+esc(x.from)+'</b> → <b>'+esc(x.to)+'</b>'+(x.approver?' → 👑 <b>'+esc(x.approver)+'</b>':'')+'</div>'+
    (x.note?'<div class="li" style="padding:6px 0">📝 '+esc(x.note)+'</div>':'')+
    (x.revNote?'<div class="li" style="padding:6px 0;color:#cf6a5e">✏️ '+esc(x.revNote)+'</div>':'')+
    (lk?'<div style="margin:8px 0">'+lk+'</div>':'')+
    '<label>🔗 แนบลิงก์เพิ่ม (บรรทัดละลิงก์)</label><textarea id="apLinks" rows="2"></textarea>';
  var showApv=(x.status==='🔁 RETURNED' && x.from===me);
  if(showApv) h+='<label>👑 ส่งให้ใครอนุมัติ</label><select id="apChoose">'+bosses+'</select>';
  var showRev=acts.some(function(a){return a[0]==='revise';});
  if(showRev) h+='<label>✏️ หมายเหตุแก้ไข (ถ้ากด "ให้แก้")</label><textarea id="apRev" rows="2"></textarea>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'+
    acts.map(function(a){return '<button class="btn '+a[2]+'" style="flex:1;min-width:120px" onclick="apvAct(\''+esc(x.id)+'\',\''+a[0]+'\')">'+a[1]+'</button>'}).join('')+
    '</div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeTask()">ปิด</button>'+
    '<p id="apMsg" style="text-align:center;font-weight:700;min-height:18px;margin:6px 0 0"></p>';
  el('taskBody').innerHTML=h; el('taskModal').classList.remove('hide');
}
function apvAct(id,action){
  var payload={links:(el('apLinks')?el('apLinks').value:'').split('\n').map(function(s){return s.trim();}).filter(Boolean)};
  if(action==='revise') payload.note=el('apRev')?el('apRev').value:'';
  if(action==='pending' && el('apChoose')) payload.approver=el('apChoose').value;
  el('apMsg').style.color='#8b9284';el('apMsg').textContent='กำลังบันทึก…';
  run('ws_apvAct',TOKEN,id,action,payload).then(function(r){
    if(!r||!r.ok){el('apMsg').style.color='#cf6a5e';el('apMsg').textContent=(r&&r.err)||'ไม่สำเร็จ';return;}
    closeTask(); renderApprove();
  });
}

var PL_MONTH='', PL_ITEMS=[], PL_CAN=false;

var PL_STAT=['📋 Plan','🎨 Design','🎬 Editing','👁️ Review','✅ Posted'];
function ymNow(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function ymShift(x){ var p=PL_MONTH.split('-'), y=+p[0], m=+p[1]+x; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} PL_MONTH=y+'-'+('0'+m).slice(-2); renderPlanner(); }
function renderPlanner(){
  if(!PL_MONTH) PL_MONTH=ymNow();
  var mm=(''+PL_MONTH).match(/^(\d{4})-(\d{2})/); PL_MONTH=mm?mm[0]:ymNow();   // 🔒 กันค่า ISO date หลุดมา
  el('content').innerHTML='<div class="box"><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">'+
    '<button class="btn ghost" onclick="ymShift(-1)">‹ ก่อน</button>'+

    '<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeTask()">ยกเลิก</button>'+
    '<p id="uMsg" style="text-align:center;font-weight:700;min-height:18px;margin:6px 0 0"></p>';
  el('taskBody').innerHTML=h; el('taskModal').classList.remove('hide');
}
function uSave(row){
  var d={row:row||'',name:el('uName').value.trim(),nick:el('uNick').value.trim(),tid:el('uTid').value.trim(),
    username:el('uUser').value.trim(),password:el('uPw').value.trim(),dept:el('uDept').value,role:el('uRole').value,email:el('uEmail').value.trim()};
  if(!d.name||!d.nick||!d.username){ el('uMsg').style.color='#cf6a5e'; el('uMsg').textContent='กรอกชื่อ-สกุล, ชื่อเล่น, username ให้ครบ'; return; }
  el('uMsg').style.color='#8b9284'; el('uMsg').textContent='กำลังบันทึก…';
  run('ws_userSave',TOKEN,d).then(function(r){
    if(!r||!r.ok){ el('uMsg').style.color='#cf6a5e'; el('uMsg').textContent=(r&&r.err)||'บันทึกไม่สำเร็จ'; return; }
    toast(r.mode==='add'?('เพิ่ม '+d.nick+' แล้ว'+(d.email?' · ส่งอีเมลแจ้งบัญชี':'')):'แก้ไขแล้ว','ok');
    closeTask(); renderUsers();
  });
}
function uDel(row){ var x=uFind(row); if(!x) return;
  if(!confirm('ลบผู้ใช้ "'+x.name+'" ออกจากระบบ?\n(งานเดิมใน DAILY จะยังอยู่)')) return;
  run('ws_userDelete',TOKEN,row).then(function(r){
    if(!r||!r.ok){ toast((r&&r.err)||'ลบไม่สำเร็จ','err'); return; }
    toast('ลบผู้ใช้แล้ว','ok'); closeTask(); renderUsers();
  });
}
function uReset(row,name){
  var pw=prompt('ตั้งรหัสผ่านใหม่ให้ "'+name+'" (อย่างน้อย 4 ตัว)'); if(!pw) return;
  run('ws_userResetPw',TOKEN,row,pw).then(function(r){
    if(!r||!r.ok){ toast((r&&r.err)||'รีเซ็ตไม่สำเร็จ','err'); return; }
    toast('รีเซ็ตรหัสแล้ว'+(r.mailed?' · แจ้งอีเมลเรียบร้อย':''),'ok');
  });
}
/* ---------- PROFILE ---------- */
function openProfile(){el('bigav').innerHTML=avatarHTML(ME);el('pfName').value=ME.name;el('pfMsg').textContent='';el('profileModal').classList.remove('hide');}
function closeProfile(){el('profileModal').classList.add('hide');}
/* 🔧 ตรวจระบบ — บอกทันทีว่าการ์ดหายเพราะอะไร */
var HTML_VERSION='HTML-2026.08.03-U';
function runDiag(){
  var b=el('diagBox'); if(!b) return;
  b.innerHTML='<div class="skel" style="height:90px"></div>';
  run('ws_diag',TOKEN).then(function(d){
    if(!d){ b.innerHTML='<div class="box" style="border-left:4px solid #cf6a5e">❌ เซิร์ฟเวอร์ไม่ตอบ</div>'; return; }
    var row=function(k,v,ok){ return '<tr><td style="color:#8b9284;padding:4px 8px 4px 0;white-space:nowrap">'+k+'</td>'+
      '<td style="padding:4px 0"><b style="color:'+(ok===false?'#a94a3f':(ok===true?'#4d7343':'#2a3128'))+'">'+esc(''+v)+'</b></td></tr>'; };
    var verOK = (d.version||'').indexOf('2026.08.03-U')>-1;
    var h='<div class="box" style="border-left:4px solid '+((verOK&&d.tzOK)?'#6f9e63':'#cf6a5e')+'">'+
      '<b style="font-size:13px">🔧 ผลตรวจระบบ</b><table style="font-size:12px;margin-top:6px">'+
      row('เวอร์ชันหน้าเว็บ', HTML_VERSION, true)+
      row('เวอร์ชันเซิร์ฟเวอร์', d.version||'เก่า (ยังไม่ Deploy)', verOK)+
      row('ผู้ใช้', d.user)+
      row('Timezone โปรเจกต์', d.tzProject+(d.tzOK?' ✅':' ⚠️ ต้องเป็น Asia/Bangkok'), d.tzOK)+
      row('เวลาไทย', d.nowBangkok)+
      row('เวลาโปรเจกต์', d.nowProject, d.tzOK)+
      row('วันที่ระบบเขียน/อ่าน', d.writeDate+' = '+d.readToday, d.dateMatch)+
      row('แถวในชีต', d.sheetRows)+
      row('การ์ดที่บอร์ดเห็น', d.kanbanCount+' ใบ (ยกมา '+d.kanbanCarried+')')+
      (d.newestRow?row('แถวล่าสุด #'+d.newestRow+' อยู่บนบอร์ด', d.newestRowInBoard?'ใช่ ✅':'ไม่ ❌', d.newestRowInBoard):'')+
      '</table>';
    if(d.recent && d.recent.length){
      h+='<div style="margin-top:8px;font-size:11.5px"><b>5 แถวล่าสุดของคุณ:</b>'+
        d.recent.map(function(r){ return '<div style="padding:3px 0;border-top:1px solid var(--line)">'+
          '#'+r.row+' · <code>'+esc(r.dateRaw)+'</code> → '+esc(r.parsed)+
          (r.isToday?' <span style="color:#4d7343">✅ วันนี้</span>':' <span style="color:#a94a3f">❌ ไม่ใช่วันนี้</span>')+
          '<br><span style="color:#8b9284">'+esc(r.item)+' · '+esc(r.status)+'</span></div>'; }).join('')+'</div>';
    }
    if(!verOK) h+='<div style="margin-top:8px;background:#fde5e0;border-radius:8px;padding:8px;font-size:12px">⚠️ <b>เซิร์ฟเวอร์ยังเป็นโค้ดเก่า</b> — ต้องวาง .gs ใหม่ แล้ว <b>Deploy → New version</b></div>';
    if(!d.tzOK) h+='<div style="margin-top:8px;background:#fdf0d5;border-radius:8px;padding:8px;font-size:12px">⚠️ <b>Timezone ไม่ใช่ Asia/Bangkok</b> — Apps Script → ⚙️ Project Settings → Time zone → เลือก <b>(GMT+07:00) Bangkok</b></div>';
    if(d.err) h+='<div style="margin-top:8px;color:#a94a3f;font-size:12px">Error: '+esc(d.err)+'</div>';
    b.innerHTML=h+'</div>';
  }).catch(function(e){
    b.innerHTML='<div class="box" style="border-left:4px solid #cf6a5e;font-size:12px">❌ เรียก ws_diag ไม่ได้ — <b>เซิร์ฟเวอร์ยังเป็นโค้ดเก่า</b><br>ต้องวาง .gs ใหม่ แล้ว Deploy → New version<br><small>'+esc(''+(e&&e.message||e))+'</small></div>';
  });
}
function saveName(){el('pfMsg').style.color='#27ae8f';el('pfMsg').textContent='กำลังบันทึก…';run('ws_updateProfile',TOKEN,{name:el('pfName').value}).then(function(r){if(r.ok){ME=r.user;el('topAv').innerHTML=avatarHTML(ME);el('pfMsg').textContent='✅ บันทึกชื่อแล้ว';}})}
function savePw(){el('pfMsg').style.color='#e2574f';run('ws_changePassword',TOKEN,el('pfOld').value,el('pfNew').value).then(function(r){if(r.ok){el('pfMsg').style.color='#27ae8f';el('pfMsg').textContent='✅ เปลี่ยนรหัสแล้ว';el('pfOld').value='';el('pfNew').value='';}else{el('pfMsg').textContent=r.err;}})}
function pickAvatar(){var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(ev){var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');var s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);var data=c.toDataURL('image/jpeg',0.7);el('pfMsg').style.color='#27ae8f';el('pfMsg').textContent='กำลังอัปโหลด…';run('ws_updateProfile',TOKEN,{avatar:data}).then(function(r){if(r.ok){ME=r.user;el('bigav').innerHTML=avatarHTML(ME);el('topAv').innerHTML=avatarHTML(ME);el('pfMsg').textContent='✅ เปลี่ยนรูปแล้ว';}});};img.src=ev.target.result;};rd.readAsDataURL(f);};inp.click();}
</script>
